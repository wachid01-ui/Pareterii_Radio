name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          echo "Android SDK root: ${SDK_ROOT}"

          SDKMANAGER="$(command -v sdkmanager)"

          echo "sdkmanager: ${SDKMANAGER}"

          yes | "${SDKMANAGER}" \
            --sdk_root="${SDK_ROOT}" \
            --licenses >/dev/null || true

          "${SDKMANAGER}" \
            --sdk_root="${SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-37"

      - name: Verify Android SDK installation
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          test -d "${SDK_ROOT}/platforms/android-37"
          test -d "${SDK_ROOT}/platform-tools"

          echo "Installed Android SDK packages:"
          sdkmanager \
            --sdk_root="${SDK_ROOT}" \
            --list_installed

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: radio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
